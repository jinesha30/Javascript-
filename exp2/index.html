<!DOCTYPE html>
<html>
<head>
    <title>Multiplication Table using JavaScript</title>

    <style>

        body{
            font-family: Arial, sans-serif;
            text-align:center;
            background:#f2f2f2;
            margin-top:30px;
        }

        .container{
            display:flex;
            justify-content:space-around;
            flex-wrap:wrap;
        }

        .box{
            width:300px;
            background:white;
            padding:20px;
            margin:15px;
            border-radius:10px;
            box-shadow:0px 0px 8px gray;
        }

        input{
            width:180px;
            padding:8px;
            font-size:16px;
        }

        button{
            margin-top:10px;
            padding:8px 15px;
            font-size:15px;
            cursor:pointer;
        }

        .result{
            margin-top:15px;
            text-align:left;
            font-size:17px;
        }

    </style>

</head>

<body>

<h1>Multiplication Table Using JavaScript</h1>

<div class="container">

    <!-- FOR LOOP -->

    <div class="box">

        <h2>For Loop</h2>

        <input type="number" id="forNum" placeholder="Enter any number">

        <br>

        <button onclick="forTable()">Generate Table</button>

        <div id="forResult" class="result"></div>

    </div>

    <!-- WHILE LOOP -->

    <div class="box">

        <h2>While Loop</h2>

        <input type="number" id="whileNum" placeholder="Enter any number">

        <br>

        <button onclick="whileTable()">Generate Table</button>

        <div id="whileResult" class="result"></div>

    </div>

    <!-- DO WHILE LOOP -->

    <div class="box">

        <h2>Do-While Loop</h2>

        <input type="number" id="doNum" placeholder="Enter any number">

        <br>

        <button onclick="doWhileTable()">Generate Table</button>

        <div id="doResult" class="result"></div>

    </div>

</div>

<script>

//---------------- FOR LOOP ----------------

function forTable()
{
    let number = document.getElementById("forNum").value;

    if(number=="")
    {
        alert("Please enter a number.");
        return;
    }

    number = Number(number);

    let table = "";

    for(let i=1;i<=10;i++)
    {
        table += number + " × " + i + " = " + (number*i) + "<br>";
    }

    document.getElementById("forResult").innerHTML = table;
}

//---------------- WHILE LOOP ----------------

function whileTable()
{
    let number = document.getElementById("whileNum").value;

    if(number=="")
    {
        alert("Please enter a number.");
        return;
    }

    number = Number(number);

    let table = "";
    let i = 1;

    while(i<=10)
    {
        table += number + " × " + i + " = " + (number*i) + "<br>";
        i++;
    }

    document.getElementById("whileResult").innerHTML = table;
}

//---------------- DO-WHILE LOOP ----------------

function doWhileTable()
{
    let number = document.getElementById("doNum").value;

    if(number=="")
    {
        alert("Please enter a number.");
        return;
    }

    number = Number(number);

    let table = "";
    let i = 1;

    do
    {
        table += number + " × " + i + " = " + (number*i) + "<br>";
        i++;
    }
    while(i<=10);

    document.getElementById("doResult").innerHTML = table;
}

</script>

</body>
</html>
